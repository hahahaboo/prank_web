<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>全螢幕流程網頁</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-size: 2em;
    }

    #background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('background.jpg') no-repeat center center fixed;
      background-size: cover;
      z-index: -2;
      transition: opacity 0.3s ease, background-image 0.3s ease;
    }

    #message {
      position: absolute;
      top: 10%;
      width: 100%;
      text-align: center;
      color: white;
      font-weight: bold;
      font-size: 2em;
      text-shadow: 2px 2px 4px black;
      z-index: 1000;
      pointer-events: none;
    }

    .flash {
      opacity: 0;
    }

    .floatingImage {
      position: absolute;
      bottom: 20px;
      left: 20px;
      width: 300px;
      height: auto;
      z-index: 1001;
      cursor: move;
      user-select: none;
      display: none;
    }
    
    #window1,
    #window2 {
    width: 450px;
    }

    .cover {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      z-index: 2000;
      display: none;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .screenFlash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, 0.7);
      z-index: 4000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.5s ease;
}


    #crash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('crash.jpg') no-repeat center center fixed;
      background-size: cover;
      z-index: 5000;
      display: none;
    }
  </style>
</head>
<body>
  <div id="background"></div>
  <div id="message">Click to start</div>

  <img id="window1" class="floatingImage" src="window.jpg" />
  <img id="window2" class="floatingImage" src="window2.jpg" />
  <div id="cover1" class="cover"></div>
  <div id="cover2" class="cover"></div>
  <div id="screenFlash" class="screenFlash"></div>
  <div id="crash"></div>

  <script>
    const background = document.getElementById('background');
    const message = document.getElementById('message');
    const window1 = document.getElementById('window1');
    const window2 = document.getElementById('window2');
    const cover1 = document.getElementById('cover1');
    const cover2 = document.getElementById('cover2');
    const screenFlash = document.getElementById('screenFlash');
    const crashScreen = document.getElementById('crash');

    let fullscreenTriggered = false;
    let chaosIntervalIds = [];

    function enterFullscreen() {
      const elem = document.documentElement;
      if (elem.requestFullscreen) elem.requestFullscreen();
    }

    function flashAndSwapBackground() {
      let count = 0;
      function flash() {
        background.classList.add('flash');
        setTimeout(() => {
          background.classList.remove('flash');
          count++;
          if (count < 2) {
            setTimeout(flash, 300);
          } else {
            background.style.backgroundImage = "url('background2.jpg')";
            sequenceAfterBackground();
          }
        }, 200);
      }
      flash();
    }

    function fadeIn(el) {
      el.style.display = 'block';
      requestAnimationFrame(() => el.style.opacity = '1');
    }

    function fadeOut(el) {
      el.style.opacity = '0';
      setTimeout(() => el.style.display = 'none', 1000);
    }

    function sequenceAfterBackground() {
      setTimeout(() => {
        cover1.style.backgroundImage = "url('cover.png')";
        fadeIn(cover1);
        setTimeout(() => {
          fadeOut(cover1);
          setTimeout(() => {
            cover2.style.backgroundImage = "url('cover2.png')";
            fadeIn(cover2);
            setTimeout(() => {
              fadeOut(cover2);
              setTimeout(() => {
                window1.style.display = 'block';
              }, 1000);
            }, 3000);
          }, 1000);
        }, 3000);
      }, 3000);
    }

    function isFullScreen() {
      return document.fullscreenElement || document.webkitFullscreenElement;
    }

    function onFullscreenChange() {
      if (isFullScreen()) {
        message.style.display = 'none';
        if (!fullscreenTriggered) {
          fullscreenTriggered = true;
          setTimeout(flashAndSwapBackground, 3000);
        }
      } else {
        fullscreenTriggered = false;
      }
    }

    ['fullscreenchange', 'webkitfullscreenchange'].forEach(evt => {
      document.addEventListener(evt, onFullscreenChange);
    });

    document.addEventListener('click', () => {
      if (!isFullScreen()) enterFullscreen();
    });

    function setupWindowDragAndClose(el, onClose = null, closable = true) {
      let isDragging = false, offsetX, offsetY;

      el.addEventListener('mousedown', function (e) {
        const rect = el.getBoundingClientRect();
        const relY = e.clientY - rect.top;
        if (relY <= rect.height / 5) {
          isDragging = true;
          offsetX = e.clientX - rect.left;
          offsetY = e.clientY - rect.top;
        } else if (relY >= rect.height * 4 / 5 && closable) {
          el.style.display = 'none';
          if (onClose) onClose();
        }
      });

      document.addEventListener('mousemove', e => {
        if (isDragging) {
          el.style.left = `${e.clientX - offsetX}px`;
          el.style.top = `${e.clientY - offsetY}px`;
          el.style.bottom = 'auto';
        }
      });
      document.addEventListener('mouseup', () => isDragging = false);
    }

    setupWindowDragAndClose(window1, () => {
      window2.style.display = 'block';
      setupWindowDragAndClose(window2, triggerChaos, true);
    }, true);

    function triggerChaos() {
      const endTime = Date.now() + 15 * 60 * 1000;

      spawnChaos('window3.jpg', 150, 500);
      spawnChaos('window4.jpg', 100, 750);
      spawnChaos('window5.jpg', 550, 1000);
      repeatRandom(() => topFlash(Math.floor(Math.random() * 3) + 1), 1000, 5000);

      setTimeout(() => {
        chaosIntervalIds.forEach(clearInterval);
        document.querySelectorAll('.chaos').forEach(e => e.remove());
        crashScreen.style.display = 'block';
      }, 15 * 60 * 1000);
    }

    function spawnChaos(src, min, max) {
      const interval = setInterval(() => {
        const img = document.createElement('img');
        img.src = src;
        img.className = 'floatingImage chaos';
        img.style.left = Math.random() * (window.innerWidth - 300) + 'px';
        img.style.top = Math.random() * (window.innerHeight - 200) + 'px';
        img.style.display = 'block';
        document.body.appendChild(img);
        setupWindowDragAndClose(img, null, false);
        setTimeout(() => img.remove(), 30000);
      }, Math.random() * (max - min) + min);
      chaosIntervalIds.push(interval);
    }

    function repeatRandom(callback, min, max) {
      function loop() {
        const delay = Math.random() * (max - min) + min;
        setTimeout(() => {
          callback();
          loop();
        }, delay);
      }
      loop();
    }

    function topFlash(times = 1) {
      function flash(count) {
        if (count === 0) return;
        screenFlash.style.opacity = '1';
        setTimeout(() => {
          screenFlash.style.opacity = '0';
          setTimeout(() => flash(count - 1), 150);
        }, 150);
      }
      flash(times);
    }
  </script>
</body>
</html>
